# Frontal mutualisé du serveur.
#
# Cette stack est INDÉPENDANTE du cycle de vie des applications : on la démarre une
# fois, elle survit aux `down`/`up` de meds-api et des autres services. Elle est la
# seule à détenir les ports 80 et 443.
#
#   docker network create edge          # une seule fois
#   docker compose up -d                # depuis deploy/edge/
#
# Voir README.md pour la procédure complète.

name: edge

services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: edge-caddy
    restart: unless-stopped

    # Les seuls ports publiés de toute la machine.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)

    environment:
      # Contact ACME. Let's Encrypt y notifie les expirations non renouvelées.
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL est obligatoire (voir .env.example)}
      # Domaines des services, consommés par les blocs de conf.d/.
      MEDS_DOMAIN: ${MEDS_DOMAIN:-meds.localhost}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./conf.d:/etc/caddy/conf.d:ro
      # robots.txt, llms.txt, ai.txt — servis par le fragment (indexation-refusee).
      # Hors de deploy/edge/ à dessein : le profil `caddy` dédié monte le même
      # dossier, une seule source pour les deux frontaux.
      - ../static:/srv/indexation:ro
      # Certificats et clés de compte ACME. À PERSISTER : sans ce volume, chaque
      # redémarrage redemande tous les certificats et consomme le quota Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config

    # Durcissement — mêmes principes que le service applicatif.
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # nécessaire pour écouter sur 80/443
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m

    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }

    networks: [edge]

volumes:
  caddy-data: {}
  caddy-config: {}

networks:
  edge:
    name: edge
    external: true
